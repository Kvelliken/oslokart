name: Grunnlag for dekningsgrad (befolkning og gangnett)

on:
  schedule:
    - cron: "41 2 3 * *"   # den 3. hver måned
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/hent_befolkning.py
      - scripts/hent_gangnett.py
      - scripts/hent_kjorenett.py
      - scripts/bygg_dekning.py
      - data/boliger.csv
      - data/delbydeler.geojson
      - data/grunnkretser.geojson
      - .github/workflows/dekning.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: dekning
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install osmnx geopandas pyproj scipy shapely numpy pandas

      - name: Hent befolkning fra Oslo statistikkbank
        run: python scripts/hent_befolkning.py

      - name: Hent gangnett fra OpenStreetMap
        run: python scripts/hent_gangnett.py

      - name: Hent kjørenett fra OpenStreetMap
        run: python scripts/hent_kjorenett.py

      - name: Bygg grunnlag for dekningsgrad
        run: python scripts/bygg_dekning.py

      - name: Lagre endringer
        id: lagre
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/befolkning.json data/gangnett_raa.json data/kjorenett_raa.json docs/data/dekning_*.json docs/data/omrader_*.geojson
          if git diff --cached --quiet; then
            echo "endret=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Oppdater grunnlag for dekningsgrad ($(date +%F))"
            git pull --rebase
            git push
            echo "endret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bygg GitHub Pages på nytt
        if: steps.lagre.outputs.endret == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
